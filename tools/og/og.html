<!doctype html><html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; } html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #fff; color: #202122;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Lato, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; gap: 56px; padding: 0 72px; }
  .thumb { flex: none; border: 1px solid #c8ccd1; background: #f8f9fa; padding: 5px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .thumb img { display: block; width: 560px; height: 420px; object-fit: cover; border: 1px solid #c8ccd1; }
  .thumb p { margin: 0; padding: 9px 5px 5px; font-size: 25px; line-height: 1.35; display: flex; justify-content: space-between; align-items: flex-start; }
  .thumb svg { margin-top: 8px; opacity: .75; }
  .side { flex: 1; }
  h1 { font-family: "Linux Libertine", Georgia, "Times New Roman", serif; font-weight: 400; font-size: 58px; margin: 0 0 14px;
    padding-bottom: 6px; border-bottom: 1px solid #a2a9b1; }
  .lede { font-size: 24px; line-height: 1.45; margin: 0 0 22px; color: #202122; }
  ul { margin: 0; padding-left: 1.2em; columns: 2; column-gap: 20px; font-size: 21px; line-height: 1.75; color: #3366cc; }
  li { break-inside: avoid; } li::marker { color: #202122; }
  .url { margin-top: 22px; font-size: 19px; color: #72777d; }
</style></head><body>
  <div class="thumb"><img src="https://upload.wikimedia.org/wikipedia/commons/c/cb/Death_8_bg_082303.jpg">
    <p>Tracks are sometimes non-linear.<svg width="18" height="13" viewBox="0 0 15 11"><path fill="none" stroke="#54595d" d="M.5 3.5h8v7h-8zM3.5 3.5v-3h11v7h-6"/></svg></p></div>
  <div class="side">
    <h1>See also</h1>
    <p class="lede">A picture from Wikipedia, with the caption somebody wrote for it. Click for another.</p>
    <ul><li>🫶 Humanity</li><li>🖼️ Art</li><li>🪶 Poetry</li><li>🦕 Dinosaurs</li><li>🍬 Sweets</li><li>🌦️ Weather</li></ul>
    <div class="url">seealso.wiki</div>
  </div>
</body></html>
